name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  standards:
    name: PHP syntax and WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - name: Syntax check on PHP 8.3
        run: find page-template-column.php includes bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer install --no-interaction --no-progress
      - run: composer lint

  e2e:
    name: End-to-end tests on WordPress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, gd
          tools: none

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: WordPress test site with the plugin, test theme and sample content
        run: |
          npm run site:setup
          npm run site:start

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Installable plugin zip
        run: npm run zip

      - uses: actions/upload-artifact@v5
        with:
          name: page-template-column-plugin
          path: dist/page-template-column.zip

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-artifacts
          path: artifacts/
          retention-days: 7
